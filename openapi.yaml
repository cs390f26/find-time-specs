openapi: 3.0.3

info:
  title: Find a Time API
  description: |
    HTTP API for creating events, submitting participant availability,
    and viewing event results.

    Each event has a name, a creator, and between 2 and 10 possible
    one-hour time slots. Time slots begin at the top of the hour.

    The web pages load without application data. JavaScript in the browser
    calls this API to get the data needed for each view and to submit new data.
  version: 1.0.0

paths:
  /api/events:
    get:
      summary: List events
      description: |
        Returns the information needed to populate the home page.

        Each event summary includes the event id, event name, creator name,
        and number of submitted responses. Time slots and individual
        participant availability are not included.
      operationId: listEvents
      responses:
        '200':
          description: All event summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              examples:
                withEvents:
                  summary: Existing events
                  value:
                    events:
                      - event_id: 1
                        event_name: CS 390 Study Group
                        creator_name: Joshua
                        response_count: 3
                      - event_id: 2
                        event_name: Holiday Party
                        creator_name: Ben
                        response_count: 0
                empty:
                  summary: No events
                  value:
                    events: []
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      summary: Create an event
      description: |
        Creates a new event from a JSON body.

        The request includes the event name, creator name, and between
        2 and 10 possible start times. Each start time represents a
        one-hour block and must begin at the top of the hour.

        Duplicate start times are not allowed within the same event.
        The response contains the id of the new event.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              event_name: CS 390 Study Group
              creator_name: Joshua
              time_slots:
                - '2026-09-28T16:00:00-04:00'
                - '2026-09-29T16:00:00-04:00'
                - '2026-09-30T18:00:00-04:00'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
              example:
                event_id: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'

    get:
      summary: Get an event
      description: |
        Returns the information needed for the Submit Availability page.

        The response includes the event name, creator name, and the event's
        possible time slots. Availability results are not included because
        results are displayed on a separate page.
      operationId: getEvent
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example:
                event_id: 1
                event_name: CS 390 Study Group
                creator_name: Joshua
                time_slots:
                  - slot_id: 1
                    start_time: '2026-09-28T16:00:00-04:00'
                  - slot_id: 2
                    start_time: '2026-09-29T16:00:00-04:00'
                  - slot_id: 3
                    start_time: '2026-09-30T18:00:00-04:00'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/events/{eventId}/availability:
    parameters:
      - $ref: '#/components/parameters/EventId'

    post:
      summary: Submit availability
      description: |
        Records one participant response for an event.

        The request contains the participant's name and the ids of the
        time slots they are available for. Every selected slot must belong
        to the event.

        An empty selected_slot_ids list is valid and means the participant
        responded that none of the listed times work.

        Results are not returned by this endpoint. The Results page uses
        GET /api/events/{eventId}/results.
      operationId: submitAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAvailabilityRequest'
            examples:
              someTimes:
                summary: Participant is available for some times
                value:
                  participant_name: Clannys
                  selected_slot_ids:
                    - 1
                    - 3
              noTimes:
                summary: None of the times work
                value:
                  participant_name: Diego
                  selected_slot_ids: []
      responses:
        '201':
          description: Availability submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAvailabilityResponse'
              example:
                response_id: 1001
                message: Availability submitted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/events/{eventId}/results:
    parameters:
      - $ref: '#/components/parameters/EventId'

    get:
      summary: Get event results
      description: |
        Returns the summary information needed for the Event Results page.

        Availability is grouped by time slot. Each result includes the
        time, the number of participants available, and the participant names.
        The response also lists participants who submitted that none of the
        proposed times work.
      operationId: getEventResults
      responses:
        '200':
          description: Results for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResults'
              example:
                event_id: 1
                event_name: CS 390 Study Group
                creator_name: Joshua
                response_count: 3
                results:
                  - slot_id: 1
                    start_time: '2026-09-28T16:00:00-04:00'
                    available_count: 2
                    participants:
                      - Clannys
                      - Alex
                  - slot_id: 2
                    start_time: '2026-09-29T16:00:00-04:00'
                    available_count: 1
                    participants:
                      - Alex
                  - slot_id: 3
                    start_time: '2026-09-30T18:00:00-04:00'
                    available_count: 2
                    participants:
                      - Clannys
                      - Alex
                none_available:
                  - Diego
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /health:
    get:
      summary: Health check
      description: |
        Returns whether the service can accept traffic, including whether
        the database is reachable.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unavailable

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Unique event identifier
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidEvent:
              summary: Invalid event data
              value:
                error:
                  code: BAD_REQUEST
                  message: An event must have between 2 and 10 time slots
            invalidAvailability:
              summary: Invalid availability data
              value:
                error:
                  code: BAD_REQUEST
                  message: A selected time slot does not belong to this event

    NotFound:
      description: The requested event does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: EVENT_NOT_FOUND
              message: Event not found

    ServiceUnavailable:
      description: The service or database is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Service unavailable

  schemas:
    EventId:
      type: integer
      minimum: 1
      description: Unique event identifier
      example: 1

    SlotId:
      type: integer
      minimum: 1
      description: Unique time-slot identifier
      example: 3

    ResponseId:
      type: integer
      minimum: 1
      description: Identifier for one submitted availability response
      example: 1001

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable

    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - EVENT_NOT_FOUND
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Human-readable explanation of the error

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    EventSummary:
      type: object
      required:
        - event_id
        - event_name
        - creator_name
        - response_count
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        event_name:
          type: string
          minLength: 1
          description: Name of the event
          example: CS 390 Study Group
        creator_name:
          type: string
          minLength: 1
          description: Name of the event creator
          example: Joshua
        response_count:
          type: integer
          minimum: 0
          description: Number of submitted responses for the event
          example: 3

    EventListResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          description: All event summaries
          items:
            $ref: '#/components/schemas/EventSummary'

    TimeSlot:
      type: object
      required:
        - slot_id
        - start_time
      properties:
        slot_id:
          $ref: '#/components/schemas/SlotId'
        start_time:
          type: string
          format: date-time
          description: Start of the one-hour time slot
          example: '2026-09-28T16:00:00-04:00'

    Event:
      type: object
      required:
        - event_id
        - event_name
        - creator_name
        - time_slots
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        event_name:
          type: string
          minLength: 1
        creator_name:
          type: string
          minLength: 1
        time_slots:
          type: array
          minItems: 2
          maxItems: 10
          description: Possible one-hour meeting times for the event
          items:
            $ref: '#/components/schemas/TimeSlot'

    CreateEventRequest:
      type: object
      additionalProperties: false
      required:
        - event_name
        - creator_name
        - time_slots
      properties:
        event_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the event
          example: CS 390 Study Group
        creator_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the person creating the event
          example: Joshua
        time_slots:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          description: |
            Possible start times for the event. Each value represents a
            one-hour block and must begin at the top of the hour.
          items:
            type: string
            format: date-time
          example:
            - '2026-09-28T16:00:00-04:00'
            - '2026-09-29T16:00:00-04:00'
            - '2026-09-30T18:00:00-04:00'

    CreateEventResponse:
      type: object
      required:
        - event_id
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'

    SubmitAvailabilityRequest:
      type: object
      additionalProperties: false
      required:
        - participant_name
        - selected_slot_ids
      properties:
        participant_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name entered by the participant
          example: Clannys
        selected_slot_ids:
          type: array
          uniqueItems: true
          description: |
            IDs of the event time slots the participant can attend.
            An empty list means none of the proposed times work.
          items:
            $ref: '#/components/schemas/SlotId'
          example:
            - 1
            - 3

    SubmitAvailabilityResponse:
      type: object
      required:
        - response_id
        - message
      properties:
        response_id:
          $ref: '#/components/schemas/ResponseId'
        message:
          type: string
          example: Availability submitted

    EventResultItem:
      type: object
      required:
        - slot_id
        - start_time
        - available_count
        - participants
      properties:
        slot_id:
          $ref: '#/components/schemas/SlotId'
        start_time:
          type: string
          format: date-time
        available_count:
          type: integer
          minimum: 0
          description: Number of participants available for this time
        participants:
          type: array
          description: Names of participants available for this time
          items:
            type: string

    EventResults:
      type: object
      required:
        - event_id
        - event_name
        - creator_name
        - response_count
        - results
        - none_available
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        event_name:
          type: string
        creator_name:
          type: string
        response_count:
          type: integer
          minimum: 0
          description: Total number of submitted responses
        results:
          type: array
          minItems: 2
          maxItems: 10
          description: Availability summary for each event time slot
          items:
            $ref: '#/components/schemas/EventResultItem'
        none_available:
          type: array
          description: Participants who responded that none of the times work
          items:
            type: string
