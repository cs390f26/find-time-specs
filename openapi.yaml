openapi: 3.0.3

info:
  title: Find a Time API
  description: |
    HTTP API for creating events, submitting participant availability,
    and viewing event results.

    Each event has a name, a creator, and between 2 and 10 possible
    one-hour time slots. Time slots begin at the top of the hour.

    The web pages load without application data. JavaScript in the browser
    calls this API to get the data needed for each view and to submit new data.

    The API contract is independent of the database implementation. The
    application stores events and responses as DynamoDB items, but the browser
    only sends and receives the JSON defined here.
  version: 1.1.0

paths:
  /api/events:
    get:
      summary: List events
      description: |
        Returns the information needed to populate the Home page.

        Each event summary includes the event id, event name, creator name,
        and number of submitted responses. The response count is calculated
        from the number of response items stored for the event.

        Time slots and individual participant availability are not included.
        An empty event list is a successful response, not an error.
      operationId: listEvents
      responses:
        '200':
          description: Event summaries returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              examples:
                withEvents:
                  summary: Existing events
                  value:
                    events:
                      - event_id: 1
                        event_name: Holiday Party
                        creator_name: Ben
                        response_count: 0
                      - event_id: 2
                        event_name: CS 390 Study Group
                        creator_name: Joshua
                        response_count: 3
                      - event_id: 3
                        event_name: Project Meeting
                        creator_name: Maya
                        response_count: 1
                empty:
                  summary: No events
                  value:
                    events: []
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      summary: Create an event
      description: |
        Creates a new event.

        The request must include a nonblank event name, a nonblank creator
        name, and between 2 and 10 unique possible start times.

        Each start time represents a one-hour block and must begin at the
        top of the hour. The server assigns the event id and time-slot ids.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              event_name: CS 390 Study Group
              creator_name: Joshua
              time_slots:
                - '2026-09-28T16:00:00-04:00'
                - '2026-09-29T16:00:00-04:00'
                - '2026-09-30T18:00:00-04:00'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
              example:
                event_id: 2
        '400':
          $ref: '#/components/responses/CreateEventBadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'

    get:
      summary: Get an event
      description: |
        Returns the information needed for the Submit Availability page.

        The response includes the event name, creator name, and the event's
        possible time slots. Availability results are not included because
        results are displayed on a separate page.
      operationId: getEvent
      responses:
        '200':
          description: Event returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example:
                event_id: 2
                event_name: CS 390 Study Group
                creator_name: Joshua
                time_slots:
                  - slot_id: 3
                    start_time: '2026-09-28T16:00:00-04:00'
                  - slot_id: 4
                    start_time: '2026-09-29T16:00:00-04:00'
                  - slot_id: 5
                    start_time: '2026-09-30T18:00:00-04:00'
        '400':
          $ref: '#/components/responses/InvalidEventId'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/events/{eventId}/availability:
    parameters:
      - $ref: '#/components/parameters/EventId'

    post:
      summary: Submit availability
      description: |
        Records one participant response for an event.

        The request contains a nonblank participant name and a list of the
        event time-slot ids the participant can attend. Every selected slot
        must belong to the event and the same slot cannot be submitted twice.

        An empty selected_slot_ids list is valid. It means the participant
        submitted a response but none of the proposed times work.

        Results are not returned by this endpoint. The Results page uses
        GET /api/events/{eventId}/results.
      operationId: submitAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAvailabilityRequest'
            examples:
              someTimes:
                summary: Participant is available for some times
                value:
                  participant_name: Clannys
                  selected_slot_ids: [3, 5]
              allTimes:
                summary: Participant is available for all times
                value:
                  participant_name: Alex
                  selected_slot_ids: [3, 4, 5]
              noTimes:
                summary: None of the times work
                value:
                  participant_name: Diego
                  selected_slot_ids: []
      responses:
        '201':
          description: Availability submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAvailabilityResponse'
              example:
                response_id: 1001
                message: Availability submitted
        '400':
          $ref: '#/components/responses/SubmitAvailabilityBadRequest'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/events/{eventId}/results:
    parameters:
      - $ref: '#/components/parameters/EventId'

    get:
      summary: Get event results
      description: |
        Returns the information needed for the Results page.

        Responses are grouped by time slot. Each result includes the time,
        the number of participants available, and their names.

        Participants whose selected_slot_ids list is empty are returned in
        none_available. They count toward response_count but do not increase
        the availability count for any time.

        An event with no responses still returns 200.
      operationId: getEventResults
      responses:
        '200':
          description: Event results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResults'
              examples:
                withResponses:
                  summary: Results with participant responses
                  value:
                    event_id: 2
                    event_name: CS 390 Study Group
                    creator_name: Joshua
                    response_count: 3
                    results:
                      - slot_id: 3
                        start_time: '2026-09-28T16:00:00-04:00'
                        available_count: 2
                        participants: [Clannys, Alex]
                      - slot_id: 4
                        start_time: '2026-09-29T16:00:00-04:00'
                        available_count: 1
                        participants: [Alex]
                      - slot_id: 5
                        start_time: '2026-09-30T18:00:00-04:00'
                        available_count: 2
                        participants: [Clannys, Alex]
                    none_available: [Diego]
                noResponses:
                  summary: Event exists but nobody has responded
                  value:
                    event_id: 1
                    event_name: Holiday Party
                    creator_name: Ben
                    response_count: 0
                    results:
                      - slot_id: 1
                        start_time: '2026-10-02T17:00:00-04:00'
                        available_count: 0
                        participants: []
                      - slot_id: 2
                        start_time: '2026-10-03T17:00:00-04:00'
                        available_count: 0
                        participants: []
                    none_available: []
        '400':
          $ref: '#/components/responses/InvalidEventId'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /health:
    get:
      summary: Health check
      description: |
        Returns whether the service can accept traffic and whether the
        database is reachable.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: A required dependency such as DynamoDB is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unavailable

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Positive integer identifying an event
      schema:
        type: integer
        minimum: 1
      example: 2

  responses:
    CreateEventBadRequest:
      description: The Create Event request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRequest:
              summary: Missing body or wrong data type
              value:
                error:
                  code: INVALID_REQUEST
                  message: Request body is invalid
            eventNameRequired:
              summary: Event name is missing or blank
              value:
                error:
                  code: EVENT_NAME_REQUIRED
                  message: Event name is required
            creatorNameRequired:
              summary: Creator name is missing or blank
              value:
                error:
                  code: CREATOR_NAME_REQUIRED
                  message: Creator name is required
            timeSlotsRequired:
              summary: Time-slot list is missing
              value:
                error:
                  code: TIME_SLOTS_REQUIRED
                  message: Time slots are required
            tooFewTimes:
              summary: Fewer than two times
              value:
                error:
                  code: INVALID_TIME_SLOT_COUNT
                  message: An event must have between 2 and 10 time slots
            tooManyTimes:
              summary: More than ten times
              value:
                error:
                  code: INVALID_TIME_SLOT_COUNT
                  message: An event must have between 2 and 10 time slots
            duplicateTime:
              summary: Duplicate proposed time
              value:
                error:
                  code: DUPLICATE_TIME_SLOT
                  message: Duplicate time slots are not allowed
            invalidTime:
              summary: Invalid date-time value
              value:
                error:
                  code: INVALID_TIME_SLOT
                  message: Each time slot must contain a valid date and time
            notOnHour:
              summary: Proposed time does not start on the hour
              value:
                error:
                  code: TIME_NOT_ON_HOUR
                  message: Each time slot must start at the top of the hour

    SubmitAvailabilityBadRequest:
      description: The Submit Availability request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidEventId:
              summary: Invalid event id
              value:
                error:
                  code: INVALID_EVENT_ID
                  message: eventId must be a positive integer
            invalidRequest:
              summary: Missing body or wrong data type
              value:
                error:
                  code: INVALID_REQUEST
                  message: Request body is invalid
            participantNameRequired:
              summary: Participant name is missing or blank
              value:
                error:
                  code: PARTICIPANT_NAME_REQUIRED
                  message: Participant name is required
            selectedSlotsRequired:
              summary: selected_slot_ids is missing
              value:
                error:
                  code: SELECTED_SLOT_IDS_REQUIRED
                  message: selected_slot_ids is required
            duplicateSlot:
              summary: Same slot id appears more than once
              value:
                error:
                  code: DUPLICATE_SLOT_ID
                  message: A time slot may only be selected once
            invalidSlotId:
              summary: Slot id is invalid
              value:
                error:
                  code: INVALID_SLOT_ID
                  message: Each selected slot id must be a positive integer
            slotNotInEvent:
              summary: Selected slot is not part of this event
              value:
                error:
                  code: SLOT_NOT_IN_EVENT
                  message: A selected time slot does not belong to this event

    InvalidEventId:
      description: The event id is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_EVENT_ID
              message: eventId must be a positive integer

    EventNotFound:
      description: The requested event does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: EVENT_NOT_FOUND
              message: Event not found

    InternalServerError:
      description: An unexpected error occurred in the application
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected server error occurred

    ServiceUnavailable:
      description: A required dependency such as DynamoDB is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Service unavailable

  schemas:
    EventId:
      type: integer
      minimum: 1
      description: Unique event identifier
      example: 2

    SlotId:
      type: integer
      minimum: 1
      description: Identifier for a time slot within an event
      example: 3

    ResponseId:
      type: integer
      minimum: 1
      description: Identifier for one submitted availability response
      example: 1001

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_EVENT_ID
            - EVENT_NAME_REQUIRED
            - CREATOR_NAME_REQUIRED
            - TIME_SLOTS_REQUIRED
            - INVALID_TIME_SLOT_COUNT
            - DUPLICATE_TIME_SLOT
            - INVALID_TIME_SLOT
            - TIME_NOT_ON_HOUR
            - PARTICIPANT_NAME_REQUIRED
            - SELECTED_SLOT_IDS_REQUIRED
            - DUPLICATE_SLOT_ID
            - INVALID_SLOT_ID
            - SLOT_NOT_IN_EVENT
            - EVENT_NOT_FOUND
            - INTERNAL_SERVER_ERROR
            - SERVICE_UNAVAILABLE
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    EventSummary:
      type: object
      additionalProperties: false
      required: [event_id, event_name, creator_name, response_count]
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        event_name:
          type: string
          minLength: 1
          maxLength: 255
        creator_name:
          type: string
          minLength: 1
          maxLength: 255
        response_count:
          type: integer
          minimum: 0

    EventListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'

    TimeSlot:
      type: object
      additionalProperties: false
      required: [slot_id, start_time]
      properties:
        slot_id:
          $ref: '#/components/schemas/SlotId'
        start_time:
          type: string
          format: date-time

    Event:
      type: object
      additionalProperties: false
      required: [event_id, event_name, creator_name, time_slots]
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        event_name:
          type: string
          minLength: 1
          maxLength: 255
        creator_name:
          type: string
          minLength: 1
          maxLength: 255
        time_slots:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TimeSlot'

    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [event_name, creator_name, time_slots]
      properties:
        event_name:
          type: string
          minLength: 1
          maxLength: 255
        creator_name:
          type: string
          minLength: 1
          maxLength: 255
        time_slots:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: date-time

    CreateEventResponse:
      type: object
      additionalProperties: false
      required: [event_id]
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'

    SubmitAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [participant_name, selected_slot_ids]
      properties:
        participant_name:
          type: string
          minLength: 1
          maxLength: 255
        selected_slot_ids:
          type: array
          minItems: 0
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SlotId'

    SubmitAvailabilityResponse:
      type: object
      additionalProperties: false
      required: [response_id, message]
      properties:
        response_id:
          $ref: '#/components/schemas/ResponseId'
        message:
          type: string

    EventResultItem:
      type: object
      additionalProperties: false
      required: [slot_id, start_time, available_count, participants]
      properties:
        slot_id:
          $ref: '#/components/schemas/SlotId'
        start_time:
          type: string
          format: date-time
        available_count:
          type: integer
          minimum: 0
        participants:
          type: array
          items:
            type: string

    EventResults:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_name
        - creator_name
        - response_count
        - results
        - none_available
      properties:
        event_id:
          $ref: '#/components/schemas/EventId'
        event_name:
          type: string
          minLength: 1
          maxLength: 255
        creator_name:
          type: string
          minLength: 1
          maxLength: 255
        response_count:
          type: integer
          minimum: 0
        results:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/EventResultItem'
        none_available:
          type: array
          items:
            type: string
