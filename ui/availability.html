<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Availability — CS 390 Study Group</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="page">
      <header class="site-header">
        <div class="brand">
          Find a Time
          <span class="brand-tag">
            Create an event. Share availability. Find the best time.
          </span>
        </div>

        <div class="header-actions">
          <button class="btn btn-primary" type="button">
            All events
          </button>

          <button class="btn btn-primary" type="button">
            Results
          </button>
        </div>
      </header>

      <article class="panel availability-panel">
        <header class="panel-header">
          <h1 class="page-title">CS 390 Study Group</h1>
          <p class="event-meta">Created by Joshua</p>
        </header>

        <div class="field">
          <label for="participant-name">Your name</label>

          <input
            id="participant-name"
            name="participant-name"
            type="text"
            value=""
            autocomplete="off"
          />
        </div>

        <fieldset class="availability-fieldset">
          <legend>Select the times you are available</legend>

          <label class="check-option">
            <input type="checkbox" name="slot" value="3" />
            <span>Monday, Sep 28 · 4:00 PM–5:00 PM</span>
          </label>

          <label class="check-option">
            <input type="checkbox" name="slot" value="4" />
            <span>Tuesday, Sep 29 · 4:00 PM–5:00 PM</span>
          </label>

          <label class="check-option">
            <input type="checkbox" name="slot" value="5" />
            <span>Wednesday, Sep 30 · 6:00 PM–7:00 PM</span>
          </label>
        </fieldset>
        <p class="field-help">
            If none of the times work, leave all boxes unchecked and submit your response.
          </p>
      </article>
      <div class="panel-actions">
        <button class="btn btn-primary" type="button">
          Submit availability
        </button>
      </div>
    </article>
  </body>
</div>
</html>
